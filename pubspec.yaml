name: preppy_workspace
description: Root workspace pubspec for the Preppy monorepo. Managed by Melos.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

workspace:
  - apps/preppy_app
  - apps/packages/shared_ui
  - apps/packages/core/analytics
  - apps/packages/core/cloud
  - apps/packages/core/auth
  - apps/packages/core/di
  - apps/packages/core/env
  - apps/packages/core/models
  - apps/packages/core/network
  - apps/packages/core/storage
  - apps/packages/core/notifications
  - apps/packages/features/auth
  - apps/packages/features/dashboard
  - apps/packages/features/ingestion
  - apps/packages/features/practice
  - apps/packages/features/pyq
  - apps/packages/features/syllabus

dev_dependencies:
  melos: ^7.7.0

melos:
  command:
    version:
      branch: main
      includeCommitId: true
    bootstrap:
      runPubGetInParallel: true

  scripts:
    analyze:
      description: Run `dart analyze` in all packages.
      run: melos exec -c 1 -- "dart analyze ."

    format:
      description: Run `dart format` across the workspace.
      run: melos exec -c 1 -- "dart format ."

    format-check:
      description: Check formatting without writing changes.
      run: melos exec -c 1 -- "dart format --set-exit-if-changed ."

    test:
      description: Run `flutter test` (or `dart test`) in every package that has tests.
      run: melos exec -c 1 --dir-exists=test -- "flutter test"

    test:dart:
      description: Run `dart test` in pure-Dart packages that have tests.
      run: melos exec -c 1 --no-flutter --dir-exists=test -- "dart test"

    clean:
      description: Clean build outputs for every package.
      run: melos exec -c 1 -- "flutter clean"

    run:dev:
      description: Run preppy_app with dev flavor and compile-time env defines.
      run: melos exec --scope=preppy_app -c 1 -- "flutter run --flavor dev --dart-define-from-file=config/env.dev.json -t lib/main_dev.dart"

    run:staging:
      description: Run preppy_app with staging flavor and env defines.
      run: melos exec --scope=preppy_app -c 1 -- "flutter run --flavor staging --dart-define-from-file=config/env.staging.json -t lib/main_staging.dart"

    run:prod:
      description: Run preppy_app with prod flavor and env defines.
      run: melos exec --scope=preppy_app -c 1 -- "flutter run --flavor prod --dart-define-from-file=config/env.prod.json -t lib/main_prod.dart"

    build:apk:prod:
      description: Build release APK for prod flavor.
      run: melos exec --scope=preppy_app -c 1 -- "flutter build apk --flavor prod --dart-define-from-file=config/env.prod.json -t lib/main_prod.dart"

    build:ios:prod:
      description: Build iOS release for prod flavor (requires signing).
      run: melos exec --scope=preppy_app -c 1 -- "flutter build ios --flavor prod --dart-define-from-file=config/env.prod.json -t lib/main_prod.dart"
