name: shared_ui
description: Preppy design system — theme, tokens and reusable widgets.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  core_models:
    path: ../core/models
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  google_fonts: ^8.0.0
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  form_builder_file_picker: ^5.1.0
  form_builder_image_picker: ^4.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
