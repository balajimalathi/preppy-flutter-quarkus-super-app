name: core_analytics
description: Vendor-neutral analytics abstraction (Firebase/GA4, composable backends).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.0'

resolution: workspace

dependencies:
  core_env:
    path: ../env
  firebase_analytics: ^12.4.1
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  riverpod: ^3.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: false
