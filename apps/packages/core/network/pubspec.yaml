name: core_network
description: HTTP (Dio), SSE, GraphQL, gRPC channel/clients, connectivity, and shared interceptors.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.0'

resolution: workspace

dependencies:
  connectivity_plus: ^6.1.4
  core_env:
    path: ../env
  core_models:
    path: ../models
  dio: ^5.9.2
  gql: ^1.0.0+1
  graphql: ^5.2.0
  grpc: ^4.1.0
  http_parser: ^4.1.2
  protobuf: ^4.2.0
  flutter:
    sdk: flutter
  riverpod: ^3.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true
