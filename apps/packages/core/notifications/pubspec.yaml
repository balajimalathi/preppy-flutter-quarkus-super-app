name: core_notifications
description: Host-agnostic push (FCM) and local notifications via Awesome Notifications.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  awesome_notifications: ^0.11.0
  awesome_notifications_fcm: ^0.11.0
  firebase_core: ^4.9.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: false
