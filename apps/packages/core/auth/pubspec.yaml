name: core_auth
description: Firebase authentication + Quarkus-backed app profile for Preppy.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.0'

resolution: workspace

dependencies:
  core_env:
    path: ../env
  core_network:
    path: ../network
  core_storage:
    path: ../storage
  dio: ^5.9.2
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.2
  riverpod: ^3.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_riverpod: ^3.3.1
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true
