name: dev_tools
description: Development-only diagnostics screens (push tracker, FCM status).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.0'

resolution: workspace

dependencies:
  core_dev_debug:
    path: ../../core/dev_debug
  core_notifications:
    path: ../../core/notifications
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^14.6.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
