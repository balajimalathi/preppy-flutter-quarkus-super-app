name: dashboard
description: Coverage map and daily plan overview.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  auth:
    path: ../../features/auth
  core_di:
    path: ../../core/di
  core_network:
    path: ../../core/network
  core_models:
    path: ../../core/models
  core_state:
    path: ../../core/state
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^14.6.1
  hive_ce: ^2.19.3
  shared_ui:
    path: ../../shared_ui

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.5

flutter:
  uses-material-design: true
