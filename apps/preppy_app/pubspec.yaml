name: preppy_app
description: Shell Flutter app for Preppy — composes every feature package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.1

  core_di:
    path: ../packages/core/core_di
  core_models:
    path: ../packages/core/core_models
  core_network:
    path: ../packages/core/core_network
  core_storage:
    path: ../packages/core/core_storage

  feature_auth:
    path: ../packages/features/feature_auth
  feature_dashboard:
    path: ../packages/features/feature_dashboard
  feature_ingestion:
    path: ../packages/features/feature_ingestion
  feature_practice:
    path: ../packages/features/feature_practice
  feature_pyq:
    path: ../packages/features/feature_pyq
  feature_syllabus:
    path: ../packages/features/feature_syllabus

  shared_ui:
    path: ../packages/shared_ui

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
