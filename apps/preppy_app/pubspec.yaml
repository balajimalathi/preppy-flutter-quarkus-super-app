name: preppy_app
description: Shell Flutter app for Preppy — composes every feature package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  flutter_riverpod: ^3.3.1
  go_router: ^14.6.1
  hive_ce_flutter: ^2.3.4

  core_analytics:
    path: ../packages/core/analytics
  core_env:
    path: ../packages/core/env
  core_di:
    path: ../packages/core/di
  core_models:
    path: ../packages/core/models
  core_network:
    path: ../packages/core/network
  core_storage:
    path: ../packages/core/storage

  auth:
    path: ../packages/features/auth
  dashboard:
    path: ../packages/features/dashboard
  ingestion:
    path: ../packages/features/ingestion
  practice:
    path: ../packages/features/practice
  pyq:
    path: ../packages/features/pyq
  syllabus:
    path: ../packages/features/syllabus

  shared_ui:
    path: ../packages/shared_ui

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutterfire_cli: ^1.3.2

flutter:
  uses-material-design: true
