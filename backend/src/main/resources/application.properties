quarkus.application.name=preppy-backend

# ---- HTTP --------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://preppy.skndan.com

# ---- Datasource (Postgres) ---------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/preppy}

# ---- Hibernate / Flyway ------------------------------------------------------
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# ---- Security ----------------------------------------------------------------
# Firebase Admin SDK (token verification in FirebaseAuthenticationMechanism).
firebase.project-id=${FIREBASE_PROJECT_ID:preppy-dev}
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase/service-account.json}

# HTTP authorization (replaces per-resource @Authenticated). First matching rule wins.
quarkus.http.auth.permission.public.paths=/q/*,/health,/metrics
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ---- Redis -------------------------------------------------------------------
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# ---- Qdrant ------------------------------------------------------------------
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}
qdrant.use-tls=${QDRANT_USE_TLS:false}

# ---- LLM ---------------------------------------------------------------------
llm.provider=${LLM_PROVIDER:none}
llm.api-key=${LLM_API_KEY:}

# ---- OpenAPI / Swagger UI ----------------------------------------------------
# Use Quarkus defaults: /q/openapi and /q/swagger-ui (covered by /q/* public permission).
# Custom paths break Dev UI's embedded Swagger (see quarkusio/quarkus#33477).
quarkus.smallrye-openapi.info-title=Preppy API
quarkus.smallrye-openapi.info-version=${project.version}
quarkus.swagger-ui.always-include=true

# ---- Container image ---------------------------------------------------------
quarkus.container-image.group=preppy
quarkus.container-image.name=backend
quarkus.container-image.tag=${project.version}
