# Overrides activated by `./mvnw quarkus:dev` and `-Dquarkus.profile=dev`.

quarkus.log.level=INFO
quarkus.log.category."com.preppy".level=DEBUG

quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/preppy

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.database.generation=validate

quarkus.redis.hosts=redis://localhost:6379

qdrant.host=localhost
qdrant.port=6334

quarkus.http.cors.origins=http://localhost:*,capacitor://localhost,http://localhost

firebase.project-id=hlp-chat
firebase.service-account.path=classpath:firebase/service-account.json

quarkus.swagger-ui.persist-authorization=true
quarkus.swagger-ui.always-include=true

# ---- File logging (backend/.log, backend/.err.log) ----------------------------
quarkus.log.file.enable=true
quarkus.log.file.path=.log
quarkus.log.file.level=INFO
quarkus.log.file.rotation.max-backup-index=5

quarkus.log.handlers=console,file,ERR_FILE
quarkus.log.handler.file.ERR_FILE.enable=true
quarkus.log.handler.file.ERR_FILE.path=.err.log
quarkus.log.handler.file.ERR_FILE.level=ERROR

quarkus.log.category."com.preppy.http".level=INFO
